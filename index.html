<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@goncas_pro650 - Canal YouTube</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>▶️</text></svg>">
</head>
<body>
    <!-- Header / Canal Info -->
    <header class="header">
        <div class="header-container">
            <div class="channel-info">
                <img id="channelImage" src="" alt="Canal" class="channel-image">
                <div class="channel-details">
                    <h1 id="channelName">@goncas_pro650</h1>
                    <div class="channel-stats">
                        <div class="stat">
                            <span class="stat-label">Inscritos</span>
                            <span id="subscribersCount" class="stat-value">-</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Visualizações</span>
                            <span id="viewsCount" class="stat-value">-</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Vídeos</span>
                            <span id="videoCount" class="stat-value">-</span>
                        </div>
                    </div>
                </div>
            </div>
            <button class="refresh-btn" onclick="refreshData()" title="Atualizar dados">🔄</button>
        </div>
    </header>

    <!-- Loading Indicator -->
    <div id="loadingIndicator" class="loading-indicator hidden">
        <div class="spinner"></div>
        <p>Carregando vídeos...</p>
    </div>

    <!-- Error Message -->
    <div id="errorMessage" class="error-message hidden">
        <span id="errorText"></span>
        <button onclick="closeError()" class="close-btn">✕</button>
    </div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <!-- Video Grid -->
            <section class="videos-section">
                <h2>Últimos Vídeos</h2>
                <div id="videosGrid" class="videos-grid">
                    <!-- Videos serão inseridos aqui dinamicamente -->
                </div>
            </section>
        </div>
    </main>

    <!-- Video Modal -->
    <div id="videoModal" class="modal hidden">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕</button>
            
            <div class="video-player-container">
                <iframe 
                    id="videoFrame" 
                    width="100%" 
                    height="600" 
                    src="" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>

            <div class="video-details">
                <h3 id="videoTitle"></h3>
                
                <div class="video-stats-container">
                    <div class="video-stat">
                        <span class="stat-icon">👁️</span>
                        <span class="stat-label">Visualizações</span>
                        <span id="modalViews" class="stat-number">-</span>
                    </div>
                    <div class="video-stat">
                        <span class="stat-icon">👍</span>
                        <span class="stat-label">Likes</span>
                        <span id="modalLikes" class="stat-number">-</span>
                    </div>
                    <div class="video-stat">
                        <span class="stat-icon">💬</span>
                        <span class="stat-label">Comentários</span>
                        <span id="modalComments" class="stat-number">-</span>
                    </div>
                </div>

                <div class="description">
                    <h4>Descrição</h4>
                    <p id="videoDescription"></p>
                </div>

                <!-- Comments Section -->
                <div class="comments-section">
                    <h4>Comentários</h4>
                    <div id="commentsList" class="comments-list">
                        <!-- Comentários serão inseridos aqui -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>📱 Canal: <strong>@goncas_pro650</strong> | Desenvolvido com ❤️</p>
        <p><a href="https://youtube.com/@goncas_pro650" target="_blank">Visitar canal no YouTube</a></p>
    </footer>

    <script type="module" src="main.js"></script>
</body>
</html>
